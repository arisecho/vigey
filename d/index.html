<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Get your video...</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0a0a0f; color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; overflow: hidden;
}
body::before {
    content: ''; position: fixed; top: -40%; left: -20%;
    width: 80%; height: 80%;
    background: radial-gradient(ellipse, rgba(34,197,94,0.06) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
}
body::after {
    content: ''; position: fixed; bottom: -40%; right: -20%;
    width: 70%; height: 70%;
    background: radial-gradient(ellipse, rgba(16,163,74,0.05) 0%, transparent 70%);
    pointer-events: none; z-index: 0;
}
.container { max-width: 420px; width: 100%; position: relative; z-index: 1; }
.box {
    background: linear-gradient(165deg, rgba(30,41,59,0.95) 0%, rgba(15,23,42,0.98) 100%);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 24px;
    padding: 32px 28px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 80px rgba(34,197,94,0.03);
    text-align: center;
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    animation: boxIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0; transform: translateY(20px) scale(0.97);
}
@keyframes boxIn { to { opacity: 1; transform: translateY(0) scale(1); } }
.title-row { margin-bottom: 4px; }
.title-row h2 {
    font-size: 22px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.3;
    background: linear-gradient(135deg, #fff 20%, #86efac 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.subtitle { color: #64748b; font-size: 13px; margin-bottom: 28px; line-height: 1.5; }
.arrow-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    margin-bottom: 24px; animation: arrowPulse 2s ease-in-out infinite;
}
.arrow-wrap .arrow-line { width: 2px; height: 16px; background: linear-gradient(180deg, transparent, #22c55e); border-radius: 2px; }
.arrow-wrap .arrow-head { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 9px solid #22c55e; }
@keyframes arrowPulse { 0%, 100% { opacity: 0.4; transform: translateY(-3px); } 50% { opacity: 1; transform: translateY(3px); } }

.error-msg {
    color: #fca5a5; background: rgba(220,38,38,0.08);
    border: 1px solid rgba(220,38,38,0.12);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
    font-size: 12.5px; line-height: 1.6; display: none; animation: shakeIn 0.4s ease;
}
.error-msg.show { display: block; }
@keyframes shakeIn { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }

.countdown-wrap { margin-bottom: 24px; transition: opacity 0.3s ease, transform 0.3s ease; }
.countdown-wrap.hide { opacity: 0; transform: scale(0.9); pointer-events: none; position: absolute; visibility: hidden; }
.countdown-label { color: #475569; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
.countdown-ring { position: relative; width: 100px; height: 100px; margin: 0 auto; }
.countdown-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.countdown-ring .ring-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 4; }
.countdown-ring .ring-fg {
    fill: none; stroke: #22c55e; stroke-width: 4; stroke-linecap: round;
    stroke-dasharray: 283; stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 6px rgba(34,197,94,0.4));
}
.countdown-num {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 34px; font-weight: 800; color: #fff;
    font-variant-numeric: tabular-nums; line-height: 1;
}
.ad-slot { min-height: 60px; display: flex; align-items: center; justify-content: center; margin: 0; transition: opacity 0.3s ease; }
.btn-wrap {
    margin: 20px 0; opacity: 0; transform: translateY(12px) scale(0.95);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none; position: absolute; visibility: hidden;
}
.btn-wrap.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; position: relative; visibility: visible; }
.btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px 24px; border-radius: 16px;
    background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
    color: #fff; text-decoration: none;
    font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 0.5px; border: none; cursor: pointer;
    position: relative; overflow: hidden;
    box-shadow: 0 4px 20px rgba(34,197,94,0.3), 0 0 40px rgba(34,197,94,0.08);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
}
.btn::before {
    content: ''; position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
    z-index: 0;
}
.btn:hover::before { animation: btnShine 0.7s ease forwards; }
@keyframes btnShine { to { left: 100%; } }
.btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow: 0 8px 30px rgba(34,197,94,0.4), 0 0 60px rgba(34,197,94,0.12);
}
.btn:active { transform: translateY(0) scale(0.98); }
.btn .btn-icon { font-size: 18px; position: relative; z-index: 1; animation: iconBounce 1.5s ease-in-out infinite; }
@keyframes iconBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
.btn .btn-text { position: relative; z-index: 1; }

.particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
.particle {
    position: absolute; width: 2px; height: 2px;
    background: rgba(34,197,94,0.3); border-radius: 50%;
    animation: particleFloat linear infinite;
}
@keyframes particleFloat {
    0%   { transform: translateY(100vh) scale(0); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

@media (max-width: 400px) {
    .box { padding: 24px 20px; border-radius: 20px; }
    .title-row h2 { font-size: 19px; }
    .countdown-ring { width: 86px; height: 86px; }
    .countdown-num { font-size: 28px; }
    .btn { padding: 16px 20px; font-size: 14px; border-radius: 14px; }
}
@media (prefers-reduced-motion: reduce) {
    .box, .error-msg, .btn-wrap { animation: none !important; transition: none !important; opacity: 1; transform: none; }
    .arrow-wrap { animation: none !important; opacity: 0.7; }
    .countdown-ring .ring-fg { transition: none !important; }
    .btn::before { animation: none !important; }
    .btn .btn-icon { animation: none !important; }
    .particle { animation: none !important; display: none; }
}
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
    <div class="box">
        <div class="title-row"><h2>Get your video here</h2></div>
        <p class="subtitle">Preparing your download link</p>

        <div class="arrow-wrap">
            <div class="arrow-line"></div>
            <div class="arrow-head"></div>
        </div>

        <div class="error-msg" id="errorMsg"></div>

        <div class="countdown-wrap" id="countdownWrap">
            <p class="countdown-label">Ready in</p>
            <div class="countdown-ring">
                <svg viewBox="0 0 100 100">
                    <circle class="ring-bg" cx="50" cy="50" r="45"/>
                    <circle class="ring-fg" id="ringFg" cx="50" cy="50" r="45"/>
                </svg>
                <span class="countdown-num" id="count">0</span>
            </div>
        </div>

        <div class="ad-slot" id="adTop">
            <script async type="text/javascript">
              atOptions = { 'key' : 'ac58840be7dd9cf9a45ac2f46de5f0ac', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script async src="https://fundingfashioned.com/ac58840be7dd9cf9a45ac2f46de5f0ac/invoke.js"></script>
        </div>

        <div class="btn-wrap" id="btnWrap">
            <a id="realBtn" class="btn" href="#">
                <span class="btn-icon">&#11015;</span>
                <span class="btn-text">DOWNLOAD NOW</span>
            </a>
        </div>

        <div class="ad-slot" id="adBottom">
            <script async type="text/javascript">
              atOptions2 = { 'key' : 'ac58840be7dd9cf9a45ac2f46de5f0ac', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script async src="https://fundingfashioned.com/ac58840be7dd9cf9a45ac2f46de5f0ac/invoke.js"></script>
        </div>
    </div>
</div>

<!-- Config & Codec -->
<script src="../src/config.js"></script>
<script src="../src/vidvast-codec.js"></script>

<script>
// =====================================================================
// FIX: Pakai VidvastCodec dari file terpisah (konsisten dengan /v/ & /g/)
// =====================================================================

// Particles
(function () {
    var container = document.getElementById('particles');
    var count = window.innerWidth < 480 ? 12 : 20;
    for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.classList.add('particle');
        p.style.left = (Math.random() * 100) + '%';
        p.style.animationDuration = (8 + Math.random() * 12) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
        container.appendChild(p);
    }
})();

// Resolve ID ke CDN URL
function resolveToCdnUrl(id) {
    if (!id) return '';
    if (/^https?:\/\//i.test(id)) return id;
    if (/^[0-9a-fA-F]{8,}$/.test(id)) return 'https://cdn.aceimg.com/' + id + '.mp4';
    if (id.indexOf('/') === -1) return 'https://cdn.videy.co/' + id + '.mp4';
    if (/^\d+\/\d+\/\d+/.test(id)) {
        var u = 'https://www.xxxfollow.com/media/fans/post_public/' + id;
        if (!/\.mp4$/i.test(u)) u += '.mp4';
        return u;
    }
    if (/[0-9a-f]{8}/.test(id) && id.split('/').length >= 4) {
        return 'https://cdn.xfree.com/xfree-prod/' + id;
    }
    var f = 'https://cdn.videy.co/' + id;
    if (!/\.mp4$/i.test(f)) f += '.mp4';
    return f;
}

// MAIN
var params  = new URLSearchParams(window.location.search);
var encoded = params.get('url');

var real = '';
var errorMsg = document.getElementById('errorMsg');
var btn = document.getElementById('realBtn');
var countEl = document.getElementById('count');
var countdownWrap = document.getElementById('countdownWrap');
var btnWrap = document.getElementById('btnWrap');
var ringFg = document.getElementById('ringFg');

var circumference = 2 * Math.PI * 45;
ringFg.style.strokeDasharray = circumference;
ringFg.style.strokeDashoffset = '0';

// FIX: support dua format input:
//   1. /d/?url=vvA1oaAygnEzwf   (encoded ID langsung)
//   2. /d/?url=aHR0cHM...        (base64 dari URL video)
if (encoded) {
    // Coba decode sebagai VidvastCodec
    if (window.VidvastCodec && VidvastCodec.isEncoded(encoded)) {
        var decodedId = VidvastCodec.decode(encoded);
        if (decodedId) real = resolveToCdnUrl(decodedId);
    }
    // Jika bukan encoded, coba base64-encoded URL
    if (!real) {
        try {
            var decodedUrl = decodeURIComponent(escape(atob(encoded)));
            if (/^https?:\/\//i.test(decodedUrl)) real = decodedUrl;
        } catch (e) {}
    }
}

if (real && /^https?:\/\//i.test(real)) {
    var t = Math.floor(Math.random() * 3) + 3; // 3-5 detik
    var total = t;
    if (navigator.webdriver) { t = 15; total = 15; }

    countEl.innerText = t;
    ringFg.style.strokeDashoffset = '0';
    setTimeout(startTimer, Math.floor(Math.random() * 800) + 400);

    function startTimer() {
        var timer = setInterval(function () {
            t--;
            countEl.innerText = t;
            var progress = (total - t) / total;
            ringFg.style.strokeDashoffset = (progress * circumference).toString();
            if (t <= 0) {
                clearInterval(timer);
                ringFg.style.strokeDashoffset = circumference.toString();
                countdownWrap.classList.add('hide');
                setTimeout(function () { btnWrap.classList.add('show'); }, 200);
                btn.href = real;
                btn.addEventListener('click', function () {
                    var redir = (window.VidvastConfig && VidvastConfig.redirectUrl) || 'https://fundingfashioned.com/a4vd13952a?key=9147ec6f3bd8b8ca1b105b1edbe281e1';
                    window.open(redir, '_blank');
                });
            }
        }, 1000);
    }
} else {
    errorMsg.textContent = 'Failed to resolve download URL. The link may be invalid or expired.';
    errorMsg.classList.add('show');
    countdownWrap.style.display = 'none';
    var aw = document.querySelector('.arrow-wrap');
    if (aw) aw.style.display = 'none';
}
</script>

</body>
</html>
